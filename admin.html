<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ProofPulse - Add Testimonial</title>
  <style>
    body { background: #09090b; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #18181b; border: 1px solid #27272a; padding: 24px; border-radius: 12px; width: 360px; }
    h2 { margin-top: 0; font-size: 20px; }
    label { font-size: 12px; color: #a1a1aa; display: block; margin-top: 12px; }
    input, textarea { width: 100%; background: #27272a; border: 1px solid #3f3f46; color: #fff; padding: 10px; border-radius: 6px; margin-top: 4px; box-sizing: border-box; }
    button { width: 100%; background: #2563eb; color: #fff; border: none; padding: 12px; border-radius: 6px; font-weight: bold; margin-top: 16px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <h2>+ Add Testimonial</h2>
    <form id="add-form">
      <label>Customer Name</label>
      <input type="text" id="name" placeholder="John Doe" required>
      
      <label>Business Name / Role</label>
      <input type="text" id="business" placeholder="E-commerce Owner">
      
      <label>Avatar Image URL</label>
      <input type="url" id="avatar" placeholder="https://images.unsplash.com/...">
      
      <label>Star Rating (1 to 5)</label>
      <input type="number" id="rating" min="1" max="5" value="5">
      
      <label>Testimonial Text</label>
      <textarea id="text" rows="3" placeholder="Great service!" required></textarea>
      
      <button type="submit">Save Testimonial</button>
    </form>
  </div>

  <script>
    const SUPABASE_URL = "https://udctjyetnervitwkjhib.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_DJMt-u-HyH0NG2AOAsriaQ_4PZpr9YC";

    document.getElementById('add-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      btn.innerText = "Saving...";

      const data = {
        customer_name: document.getElementById('name').value,
        business_name: document.getElementById('business').value,
        avatar_url: document.getElementById('avatar').value || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150',
        rating: parseInt(document.getElementById('rating').value),
        testimonial_text: document.getElementById('text').value,
        status: 'approved'
      };

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/testimonials`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify(data)
        });

        if (res.ok) {
          alert('Testimonial added successfully!');
          e.target.reset();
        } else {
          alert('Error adding testimonial.');
        }
      } catch (err) {
        alert('Connection error.');
      } finally {
        btn.innerText = "Save Testimonial";
      }
    });
  </script>
</body>
</html>
