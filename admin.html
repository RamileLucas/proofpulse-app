<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ProofPulse - Add Testimonial</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #09090b; color: #f4f4f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 16px; }
    
    .card { background: #141417; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; padding: 24px; width: 100%; max-width: 420px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); }
    .brand { color: #3b82f6; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 6px; }
    h2 { margin: 0 0 20px 0; font-size: 22px; font-weight: 700; color: #ffffff; letter-spacing: -0.5px; }
    
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 12px; color: #a1a1aa; margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    input[type="text"], textarea { width: 100%; background: #09090b; border: 1px solid #27272a; color: #ffffff; padding: 14px; border-radius: 12px; font-size: 15px; transition: all 0.2s; }
    input[type="text"]:focus, textarea:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
    
    /* Area de Upload Customizada */
    .file-dropzone { border: 2px dashed #27272a; border-radius: 14px; padding: 20px; text-align: center; background: #09090b; cursor: pointer; transition: all 0.2s; position: relative; }
    .file-dropzone:hover { border-color: #3b82f6; background: rgba(59, 130, 246, 0.03); }
    .file-dropzone input { display: none; }
    .file-dropzone-text { font-size: 13px; color: #a1a1aa; }
    .file-dropzone-text span { color: #3b82f6; font-weight: 600; }

    /* Container de Previa com o Botao X */
    .preview-container { display: none; position: relative; margin-top: 10px; border-radius: 12px; overflow: hidden; border: 1px solid #3f3f46; background: #000; }
    .preview-container img, .preview-container video { width: 100%; max-height: 240px; display: block; object-fit: contain; }
    .btn-remove-preview { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.75); color: #fff; border: 1px solid rgba(255,255,255,0.2); width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; backdrop-filter: blur(4px); transition: transform 0.15s ease; z-index: 10; }
    .btn-remove-preview:active { transform: scale(0.9); }

    /* Estrelas Gigantes Mobile Friendly */
    .star-rating { display: flex; gap: 10px; font-size: 32px; cursor: pointer; user-select: none; margin-top: 4px; }
    .star { color: #27272a; transition: color 0.15s ease, transform 0.15s ease; }
    .star.active { color: #fbbf24; text-shadow: 0 0 12px rgba(251, 191, 36, 0.4); }
    .star:active { transform: scale(1.2); }

    /* Botao Principal */
    button[type="submit"] { width: 100%; background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #ffffff; border: none; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 14px 0 rgba(37, 99, 235, 0.39); transition: all 0.2s; margin-top: 10px; }
    button[type="submit"]:active { transform: scale(0.98); opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .toast { display: none; padding: 14px; border-radius: 12px; font-size: 14px; margin-bottom: 20px; text-align: center; font-weight: 600; }
    .toast.success { display: block; background: rgba(34, 197, 94, 0.12); border: 1px solid #22c55e; color: #4ade80; }
    .toast.error { display: block; background: rgba(239, 68, 68, 0.12); border: 1px solid #ef4444; color: #f87171; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">ProofPulse Studio</div>
    <h2>+ Add Testimonial</h2>
    
    <div id="toast" class="toast"></div>

    <form id="add-form">
      <div class="form-group">
        <label>Customer Name *</label>
        <input type="text" id="name" placeholder="Sarah Jenkins" required>
      </div>
      
      <div class="form-group">
        <label>Business Name / Role</label>
        <input type="text" id="business" placeholder="TechFlow Inc">
      </div>

      <!-- Upload de Foto ou Video -->
      <div class="form-group">
        <label>Customer Photo or Video</label>
        
        <div class="file-dropzone" id="dropzone" onclick="document.getElementById('media-file').click()">
          <div class="file-dropzone-text">
            📷 🎥 <span>Tap to upload photo or video</span>
          </div>
          <input type="file" id="media-file" accept="image/*,video/*">
        </div>

        <!-- Container da Previa com o Botao X -->
        <div class="preview-container" id="preview-container">
          <button type="button" class="btn-remove-preview" id="btn-remove">✕</button>
          <div id="preview-content"></div>
        </div>
      </div>

      <div class="form-group">
        <label>Star Rating</label>
        <div class="star-rating" id="star-container">
          <span class="star active" data-value="1">★</span>
          <span class="star active" data-value="2">★</span>
          <span class="star active" data-value="3">★</span>
          <span class="star active" data-value="4">★</span>
          <span class="star active" data-value="5">★</span>
        </div>
      </div>

      <div class="form-group">
        <label>Testimonial Text *</label>
        <textarea id="text" rows="3" placeholder="What did they say about your product?" required></textarea>
      </div>

      <button type="submit" id="submit-btn">Publish Testimonial</button>
    </form>
  </div>

  <script>
    const SUPABASE_URL = "https://udctjyetnervitwkjhib.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_DJMt-u-HyH0NG2AOAsriaQ_4PZpr9YC";
    let currentRating = 5;
    let selectedFile = null;

    // Elementos de Previa
    const fileInput = document.getElementById('media-file');
    const previewContainer = document.getElementById('preview-container');
    const previewContent = document.getElementById('preview-content');
    const btnRemove = document.getElementById('btn-remove');
    const dropzone = document.getElementById('dropzone');

    // Manipulacao do Upload e Previa de Foto / Video
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      selectedFile = file;
      const objectUrl = URL.createObjectURL(file);
      previewContent.innerHTML = '';

      if (file.type.startsWith('video/')) {
        const video = document.createElement('video');
        video.src = objectUrl;
        video.controls = true;
        video.playsInline = true;
        previewContent.appendChild(video);
      } else {
        const img = document.createElement('img');
        img.src = objectUrl;
        previewContent.appendChild(img);
      }

      previewContainer.style.display = 'block';
      dropzone.style.display = 'none';
    });

    // Botao X para apagar a previa
    btnRemove.addEventListener('click', (e) => {
      e.stopPropagation();
      selectedFile = null;
      fileInput.value = '';
      previewContent.innerHTML = '';
      previewContainer.style.display = 'none';
      dropzone.style.display = 'block';
    });

    // Lógica das Estrelas
    const stars = document.querySelectorAll('.star');
    stars.forEach(star => {
      star.addEventListener('click', (e) => {
        currentRating = parseInt(e.target.getAttribute('data-value'));
        updateStars();
      });
    });

    function updateStars() {
      stars.forEach(star => {
        const val = parseInt(star.getAttribute('data-value'));
        if (val <= currentRating) star.classList.add('active');
        else star.classList.remove('active');
      });
    }

    // Enviar Arquivo para o Supabase Storage
    async function uploadMedia(file) {
      if (!file) return { url: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150', type: 'image' };
      
      const isVideo = file.type.startsWith('video/');
      const fileExt = file.name.split('.').pop();
      const fileName = `${Date.now()}.${fileExt}`;

      const res = await fetch(`${SUPABASE_URL}/storage/v1/object/avatars/${fileName}`, {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
          'Content-Type': file.type
        },
        body: file
      });

      if (res.ok) {
        return {
          url: `${SUPABASE_URL}/storage/v1/object/public/avatars/${fileName}`,
          type: isVideo ? 'video' : 'image'
        };
      } else {
        return { url: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150', type: 'image' };
      }
    }

    // Submit
    document.getElementById('add-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const toast = document.getElementById('toast');
      
      btn.disabled = true;
      btn.innerText = "Uploading Media & Saving...";
      toast.className = "toast";

      try {
        const media = await uploadMedia(selectedFile);

        const data = {
          customer_name: document.getElementById('name').value,
          business_name: document.getElementById('business').value,
          avatar_url: media.type === 'image' ? media.url : 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150',
          media_url: media.url,
          media_type: media.type,
          rating: currentRating,
          testimonial_text: document.getElementById('text').value,
          status: 'approved'
        };

        const res = await fetch(`${SUPABASE_URL}/rest/v1/testimonials`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify(data)
        });

        if (res.ok) {
          toast.innerText = "✨ Testimonial & Media published successfully!";
          toast.classList.add('success');
          e.target.reset();
          btnRemove.click(); // reseta a previa
          currentRating = 5;
          updateStars();
        } else {
          toast.innerText = "❌ Error saving to database.";
          toast.classList.add('error');
        }
      } catch (err) {
        toast.innerText = "❌ Connection error.";
        toast.classList.add('error');
      } finally {
        btn.disabled = false;
        btn.innerText = "Publish Testimonial";
      }
    });
  </script>
</body>
</html>
