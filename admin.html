<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ProofPulse - Admin Dashboard</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #09090b; color: #f4f4f5; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; margin: 0; padding: 16px; }

    /* Login Screen Container */
    .login-wrapper { display: flex; justify-content: center; align-items: center; width: 100%; min-height: 85vh; }
    .login-card { background: #141417; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; padding: 32px 28px; width: 100%; max-width: 380px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); text-align: center; }
    .login-card h2 { margin: 8px 0 20px 0; font-size: 22px; font-weight: 700; color: #ffffff; }

    /* Dashboard Container */
    .dashboard-container { width: 100%; max-width: 650px; margin-top: 10px; display: none; }
    
    /* Header and Navigation Tabs */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .brand { color: #3b82f6; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; }
    h2 { margin: 4px 0 0 0; font-size: 24px; font-weight: 700; color: #ffffff; letter-spacing: -0.5px; }

    .btn-logout { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); padding: 8px 14px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
    .btn-logout:hover { background: #ef4444; color: #fff; }

    .nav-tabs { display: flex; gap: 8px; background: #141417; padding: 6px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.08); margin-bottom: 20px; }
    .tab-btn { flex: 1; background: transparent; color: #a1a1aa; border: none; padding: 10px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .tab-btn.active { background: #2563eb; color: #ffffff; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Review Cards */
    .card { background: #141417; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; padding: 20px; width: 100%; margin-bottom: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative; }
    
    .item-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .user-info { display: flex; align-items: center; gap: 12px; }
    .avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid #3b82f6; }
    .user-details h4 { margin: 0; font-size: 15px; color: #fff; }
    .user-details p { margin: 2px 0 0 0; font-size: 12px; color: #a1a1aa; }

    .badge { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px; }
    .badge.pending { background: rgba(234, 179, 8, 0.15); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.3); }
    .badge.approved { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }

    .rating { color: #fbbf24; font-size: 14px; margin-bottom: 8px; }
    .text { font-size: 14px; color: #e4e4e7; line-height: 1.5; margin: 0 0 14px 0; }

    /* Media List */
    .media-preview-list { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 14px; padding-bottom: 4px; }
    .media-thumb { width: 70px; height: 70px; border-radius: 8px; object-fit: cover; border: 1px solid #3f3f46; background: #000; flex-shrink: 0; }

    /* Action Buttons */
    .actions { display: flex; gap: 8px; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 14px; }
    .btn-action { flex: 1; border: none; padding: 10px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-approve { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.4); }
    .btn-approve:hover { background: #22c55e; color: #fff; }
    .btn-unapprove { background: rgba(234, 179, 8, 0.2); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.4); }
    .btn-unapprove:hover { background: #eab308; color: #000; }
    .btn-delete { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); flex: 0 0 44px; }
    .btn-delete:hover { background: #ef4444; color: #fff; }

    /* Form Styles */
    .form-group { margin-bottom: 16px; text-align: left; }
    label { display: block; font-size: 12px; color: #a1a1aa; margin-bottom: 6px; font-weight: 600; text-transform: uppercase; }
    input[type="text"], input[type="email"], input[type="password"], textarea { width: 100%; background: #09090b; border: 1px solid #27272a; color: #ffffff; padding: 14px; border-radius: 12px; font-size: 15px; }
    input:focus, textarea:focus { outline: none; border-color: #3b82f6; }
    
    .file-dropzone { border: 2px dashed #27272a; border-radius: 14px; padding: 20px; text-align: center; background: #09090b; cursor: pointer; }
    .file-dropzone input { display: none; }
    .file-dropzone-text { font-size: 13px; color: #a1a1aa; }
    .file-dropzone-text span { color: #3b82f6; font-weight: 600; }
    .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 8px; margin-top: 10px; }
    .media-item { position: relative; width: 100%; height: 75px; border-radius: 8px; overflow: hidden; border: 1px solid #3f3f46; }
    .media-item img, .media-item video { width: 100%; height: 100%; object-fit: cover; }
    .btn-remove-item { position: absolute; top: 2px; right: 2px; background: rgba(239, 68, 68, 0.85); color: #fff; border: none; width: 20px; height: 20px; border-radius: 50%; font-size: 10px; cursor: pointer; }

    .star-rating { display: flex; gap: 8px; font-size: 28px; cursor: pointer; }
    .star { color: #27272a; }
    .star.active { color: #fbbf24; }

    button[type="submit"] { width: 100%; background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #ffffff; border: none; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px; }

    .error-msg { color: #f87171; font-size: 13px; margin-bottom: 12px; display: none; }
    .empty-state { text-align: center; padding: 40px 20px; color: #a1a1aa; font-size: 14px; }
  </style>
</head>
<body>

  <!-- VIEW 1: LOGIN FORM -->
  <div class="login-wrapper" id="login-screen">
    <div class="login-card">
      <div class="brand">ProofPulse Admin</div>
      <h2>Sign In</h2>
      <div class="error-msg" id="login-error">Invalid email or password.</div>
      <form id="login-form">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="login-email" placeholder="admin@proofpulse.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="••••••••" required>
        </div>
        <button type="submit" id="btn-login-submit">Login</button>
      </form>
    </div>
  </div>

  <!-- VIEW 2: DASHBOARD PANEL -->
  <div class="dashboard-container" id="dashboard-screen">
    <div class="header">
      <div>
        <div class="brand">ProofPulse Dashboard</div>
        <h2>Review Management</h2>
      </div>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>

    <!-- Navigation Tabs -->
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('moderation')">📥 Moderation (<span id="pending-count">0</span>)</button>
      <button class="tab-btn" onclick="switchTab('approved')">✅ Approved (<span id="approved-count">0</span>)</button>
      <button class="tab-btn" onclick="switchTab('create')">➕ Add New</button>
    </div>

    <!-- TAB 1: MODERATION (PENDING) -->
    <div id="tab-moderation" class="tab-content active">
      <div id="list-pending"></div>
    </div>

    <!-- TAB 2: APPROVED -->
    <div id="tab-approved" class="tab-content">
      <div id="list-approved"></div>
    </div>

    <!-- TAB 3: CREATE MANUALLY -->
    <div id="tab-create" class="tab-content">
      <div class="card">
        <form id="add-form">
          <div class="form-group">
            <label>Customer Name *</label>
            <input type="text" id="name" placeholder="e.g. Robert Miller" required>
          </div>
          <div class="form-group">
            <label>Company / Location</label>
            <input type="text" id="business" placeholder="e.g. Founder at Acme Co.">
          </div>
          <div class="form-group">
            <label>Product Photos / Videos</label>
            <div class="file-dropzone" onclick="document.getElementById('media-files').click()">
              <div class="file-dropzone-text">📷 🎥 <span>Click to attach photos or videos</span></div>
              <input type="file" id="media-files" accept="image/*,video/*" multiple>
            </div>
            <div class="media-grid" id="media-grid"></div>
          </div>
          <div class="form-group">
            <label>Rating</label>
            <div class="star-rating" id="star-container">
              <span class="star active" data-value="1">★</span>
              <span class="star active" data-value="2">★</span>
              <span class="star active" data-value="3">★</span>
              <span class="star active" data-value="4">★</span>
              <span class="star active" data-value="5">★</span>
            </div>
          </div>
          <div class="form-group">
            <label>Review Content *</label>
            <textarea id="text" rows="3" placeholder="Write or paste the review here..." required></textarea>
          </div>
          <button type="submit" id="submit-btn">Publish Review</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://udctjyetnervitwkjhib.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_DJMt-u-HyH0NG2AOAsriaQ_4PZpr9YC";
    
    let authToken = localStorage.getItem("pp_auth_token") || null;
    let allTestimonials = [];
    let currentRating = 5;
    let selectedFiles = [];

    // Check Auth Status on Load
    function initAuth() {
      if (authToken) {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('dashboard-screen').style.display = 'block';
        loadTestimonials();
      } else {
        document.getElementById('login-screen').style.display = 'flex';
        document.getElementById('dashboard-screen').style.display = 'none';
      }
    }

    // Login Handler
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const errorEl = document.getElementById('login-error');
      const btn = document.getElementById('btn-login-submit');

      errorEl.style.display = 'none';
      btn.disabled = true;
      btn.innerText = "Authenticating...";

      try {
        const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY
          },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok && data.access_token) {
          authToken = data.access_token;
          localStorage.setItem("pp_auth_token", authToken);
          initAuth();
        } else {
          errorEl.innerText = data.error_description || "Invalid email or password.";
          errorEl.style.display = 'block';
        }
      } catch (err) {
        errorEl.innerText = "Network error. Please try again.";
        errorEl.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.innerText = "Login";
      }
    });

    // Logout Handler
    function logout() {
      localStorage.removeItem("pp_auth_token");
      authToken = null;
      initAuth();
    }

    // Navigation Tabs
    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

      if (tabName === 'moderation') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tab-moderation').classList.add('active');
      } else if (tabName === 'approved') {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tab-approved').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[2].classList.add('active');
        document.getElementById('tab-create').classList.add('active');
      }
    }

    // Load testimonials
    async function loadTestimonials() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/testimonials?select=*&order=created_at.desc`, {
          headers: {
            apikey: SUPABASE_ANON_KEY,
            Authorization: `Bearer ${authToken}`
          }
        });

        if (res.status === 401) { logout(); return; }

        allTestimonials = await res.json();
        renderLists();
      } catch (err) {
        console.error("Error loading testimonials:", err);
      }
    }

    // Render lists
    function renderLists() {
      const pendingList = document.getElementById('list-pending');
      const approvedList = document.getElementById('list-approved');

      const pendingItems = allTestimonials.filter(t => t.status === 'pending');
      const approvedItems = allTestimonials.filter(t => t.status === 'approved');

      document.getElementById('pending-count').innerText = pendingItems.length;
      document.getElementById('approved-count').innerText = approvedItems.length;

      if (pendingItems.length === 0) {
        pendingList.innerHTML = `<div class="empty-state">🎉 No pending reviews to moderate right now!</div>`;
      } else {
        pendingList.innerHTML = pendingItems.map(t => createCardHTML(t)).join('');
      }

      if (approvedItems.length === 0) {
        approvedList.innerHTML = `<div class="empty-state">No approved reviews yet.</div>`;
      } else {
        approvedList.innerHTML = approvedItems.map(t => createCardHTML(t)).join('');
      }
    }

    function createCardHTML(t) {
      const stars = "★".repeat(t.rating || 5) + "☆".repeat(5 - (t.rating || 5));
      const items = t.media_items || [];
      if (items.length === 0 && t.media_url) items.push({ url: t.media_url, type: t.media_type });

      let mediaHTML = '';
      if (items.length > 0) {
        mediaHTML = `<div class="media-preview-list">` + items.map(m => {
          if (m.type === 'video') return `<video class="media-thumb" src="${m.url}"></video>`;
          return `<img class="media-thumb" src="${m.url}" />`;
        }).join('') + `</div>`;
      }

      const isApproved = t.status === 'approved';

      return `
        <div class="card">
          <div class="item-header">
            <div class="user-info">
              <img class="avatar" src="${t.avatar_url || 'https://via.placeholder.com/150'}">
              <div class="user-details">
                <h4>${t.customer_name}</h4>
                <p>${t.business_name || 'Customer'}</p>
              </div>
            </div>
            <span class="badge ${t.status}">${t.status === 'approved' ? 'Live' : 'Pending'}</span>
          </div>

          <div class="rating">${stars}</div>
          <p class="text">"${t.testimonial_text}"</p>
          ${mediaHTML}

          <div class="actions">
            ${isApproved 
              ? `<button class="btn-action btn-unapprove" onclick="updateStatus('${t.id}', 'pending')">🟡 Hide</button>`
              : `<button class="btn-action btn-approve" onclick="updateStatus('${t.id}', 'approved')">🟢 Approve Now</button>`
            }
            <button class="btn-action btn-delete" onclick="deleteTestimonial('${t.id}')">🗑️</button>
          </div>
        </div>
      `;
    }

    async function updateStatus(id, newStatus) {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/testimonials?id=eq.${id}`, {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${authToken}`
          },
          body: JSON.stringify({ status: newStatus })
        });

        if (res.ok) {
          const item = allTestimonials.find(t => t.id === id);
          if (item) item.status = newStatus;
          renderLists();
        }
      } catch (err) {
        alert("Error updating review status.");
      }
    }

    async function deleteTestimonial(id) {
      if (!confirm("Are you sure you want to delete this review?")) return;

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/testimonials?id=eq.${id}`, {
          method: 'DELETE',
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${authToken}`
          }
        });

        if (res.ok) {
          allTestimonials = allTestimonials.filter(t => t.id !== id);
          renderLists();
        }
      } catch (err) {
        alert("Error deleting review.");
      }
    }

    // Manual Creation
    const fileInput = document.getElementById('media-files');
    const mediaGrid = document.getElementById('media-grid');

    fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      files.forEach(f => selectedFiles.push(f));
      renderPreviews();
      fileInput.value = '';
    });

    function renderPreviews() {
      mediaGrid.innerHTML = '';
      selectedFiles.forEach((file, index) => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'media-item';
        const btnRemove = document.createElement('button');
        btnRemove.className = 'btn-remove-item';
        btnRemove.innerText = '✕';
        btnRemove.onclick = (e) => { e.stopPropagation(); selectedFiles.splice(index, 1); renderPreviews(); };
        const objectUrl = URL.createObjectURL(file);
        if (file.type.startsWith('video/')) {
          const video = document.createElement('video');
          video.src = objectUrl;
          itemDiv.appendChild(video);
        } else {
          const img = document.createElement('img');
          img.src = objectUrl;
          itemDiv.appendChild(img);
        }
        itemDiv.appendChild(btnRemove);
        mediaGrid.appendChild(itemDiv);
      });
    }

    const stars = document.querySelectorAll('.star');
    stars.forEach(star => {
      star.addEventListener('click', (e) => {
        currentRating = parseInt(e.target.getAttribute('data-value'));
        stars.forEach(s => {
          const val = parseInt(s.getAttribute('data-value'));
          if (val <= currentRating) s.classList.add('active');
          else s.classList.remove('active');
        });
      });
    });

    async function uploadAllMedia(files) {
      if (files.length === 0) return [];
      const promises = files.map(async (file) => {
        const isVideo = file.type.startsWith('video/');
        const fileExt = file.name.split('.').pop();
        const fileName = `admin_${Date.now()}_${Math.random().toString(36).substr(2, 5)}.${fileExt}`;

        const res = await fetch(`${SUPABASE_URL}/storage/v1/object/avatars/${fileName}`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${authToken}`,
            'Content-Type': file.type
          },
          body: file
        });
        if (res.ok) {
          return { url: `${SUPABASE_URL}/storage/v1/object/public/avatars/${fileName}`, type: isVideo ? 'video' : 'image' };
        }
        return null;
      });
      const res = await Promise.all(promises);
      return res.filter(r => r !== null);
    }

    document.getElementById('add-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerText = "Publishing...";

      try {
        const uploadedMedia = await uploadAllMedia(selectedFiles);
        const customerName = document.getElementById('name').value;
        const generatedAvatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(customerName)}&background=2563eb&color=ffffff&bold=true`;

        const data = {
          customer_name: customerName,
          business_name: document.getElementById('business').value,
          avatar_url: generatedAvatar,
          media_items: uploadedMedia,
          rating: currentRating,
          testimonial_text: document.getElementById('text').value,
          status: 'approved'
        };

        const res = await fetch(`${SUPABASE_URL}/rest/v1/testimonials`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${authToken}`,
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify(data)
        });

        if (res.ok) {
          alert("✨ Review created successfully!");
          e.target.reset();
          selectedFiles = [];
          renderPreviews();
          loadTestimonials();
          switchTab('approved');
        }
      } catch (err) {
        alert("Error creating review.");
      } finally {
        btn.disabled = false;
        btn.innerText = "Publish Review";
      }
    });

    // Check auth on page load
    initAuth();
  </script>
</body>
</html>
