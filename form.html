<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Leave a Review</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #09090b; color: #f4f4f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 16px; }
    .card { background: #141417; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; padding: 24px; width: 100%; max-width: 440px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
    h2 { margin: 0 0 6px 0; font-size: 20px; color: #fff; }
    p.subtitle { margin: 0 0 20px 0; font-size: 13px; color: #a1a1aa; }
    .form-group { margin-bottom: 16px; text-align: left; }
    label { display: block; font-size: 12px; color: #a1a1aa; margin-bottom: 6px; font-weight: 600; text-transform: uppercase; }
    input[type="text"], textarea { width: 100%; background: #09090b; border: 1px solid #27272a; color: #ffffff; padding: 12px; border-radius: 10px; font-size: 14px; }
    input:focus, textarea:focus { outline: none; border-color: #3b82f6; }
    .star-rating { display: flex; gap: 8px; font-size: 28px; cursor: pointer; }
    .star { color: #27272a; }
    .star.active { color: #fbbf24; }
    button[type="submit"] { width: 100%; background: #2563eb; color: #ffffff; border: none; padding: 14px; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 10px; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Leave Your Review</h2>
    <p class="subtitle">Share your feedback and photos with us!</p>
    <form id="review-form">
      <div class="form-group">
        <label>Your Name *</label>
        <input type="text" id="name" placeholder="John Doe" required>
      </div>
      <div class="form-group">
        <label>Location / Business (Optional)</label>
        <input type="text" id="business" placeholder="New York, NY">
      </div>
      <div class="form-group">
        <label>Rating</label>
        <div class="star-rating" id="star-container">
          <span class="star active" data-value="1">★</span>
          <span class="star active" data-value="2">★</span>
          <span class="star active" data-value="3">★</span>
          <span class="star active" data-value="4">★</span>
          <span class="star active" data-value="5">★</span>
        </div>
      </div>
      <div class="form-group">
        <label>Your Review *</label>
        <textarea id="text" rows="4" placeholder="How was your experience?" required></textarea>
      </div>
      <button type="submit" id="submit-btn">Submit Review</button>
    </form>
  </div>

  <script>
    const SUPABASE_URL = "https://udctjyetnervitwkjhib.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_DJMt-u-HyH0NG2AOAsriaQ_4PZpr9YC";
    
    const urlParams = new URLSearchParams(window.location.search);
    const STORE_ID = urlParams.get('store') || urlParams.get('store_id') || 'default';

    let currentRating = 5;
    const stars = document.querySelectorAll('.star');
    stars.forEach(star => {
      star.addEventListener('click', (e) => {
        currentRating = parseInt(e.target.getAttribute('data-value'));
        stars.forEach(s => {
          const val = parseInt(s.getAttribute('data-value'));
          if (val <= currentRating) s.classList.add('active');
          else s.classList.remove('active');
        });
      });
    });

    document.getElementById('review-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerText = "Submitting...";

      const name = document.getElementById('name').value;
      const avatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=2563eb&color=ffffff&bold=true`;

      const payload = {
        customer_name: name,
        business_name: document.getElementById('business').value,
        avatar_url: avatar,
        rating: currentRating,
        testimonial_text: document.getElementById('text').value,
        status: 'pending',
        store_id: STORE_ID
      };

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/testimonials`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          alert("Thank you! Your review has been submitted for moderation.");
          e.target.reset();
        } else {
          alert("Could not submit review. Please try again.");
        }
      } catch (err) {
        alert("Network error.");
      } finally {
        btn.disabled = false;
        btn.innerText = "Submit Review";
      }
    });
  </script>
</body>
</html>
