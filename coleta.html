<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Deixe sua Avaliação</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #09090b; color: #f4f4f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 16px; }
    
    .card { background: #141417; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; padding: 24px; width: 100%; max-width: 440px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); }
    .brand { color: #3b82f6; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 6px; text-align: center; }
    h2 { margin: 0 0 8px 0; font-size: 22px; font-weight: 700; color: #ffffff; text-align: center; letter-spacing: -0.5px; }
    p.subtitle { margin: 0 0 24px 0; font-size: 13px; color: #a1a1aa; text-align: center; }

    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 12px; color: #a1a1aa; margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    input[type="text"], textarea { width: 100%; background: #09090b; border: 1px solid #27272a; color: #ffffff; padding: 14px; border-radius: 12px; font-size: 15px; transition: all 0.2s; }
    input[type="text"]:focus, textarea:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
    
    /* Area de Dropzone */
    .file-dropzone { border: 2px dashed #27272a; border-radius: 14px; padding: 20px; text-align: center; background: #09090b; cursor: pointer; transition: all 0.2s; }
    .file-dropzone:hover { border-color: #3b82f6; background: rgba(59, 130, 246, 0.03); }
    .file-dropzone input { display: none; }
    .file-dropzone-text { font-size: 13px; color: #a1a1aa; }
    .file-dropzone-text span { color: #3b82f6; font-weight: 600; }

    /* Grid de Miniaturas */
    .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; margin-top: 12px; }
    .media-item { position: relative; width: 100%; height: 85px; border-radius: 10px; overflow: hidden; border: 1px solid #3f3f46; background: #000; }
    .media-item img, .media-item video { width: 100%; height: 100%; object-fit: cover; }
    .media-item .video-tag { position: absolute; bottom: 4px; left: 4px; background: rgba(0,0,0,0.7); color: #fff; font-size: 9px; padding: 2px 4px; border-radius: 4px; }
    
    .btn-remove-item { position: absolute; top: 4px; right: 4px; background: rgba(239, 68, 68, 0.85); color: #fff; border: none; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; backdrop-filter: blur(4px); }

    /* Rating Interativo */
    .star-rating { display: flex; justify-content: center; gap: 10px; font-size: 36px; cursor: pointer; user-select: none; margin: 8px 0 16px 0; }
    .star { color: #27272a; transition: color 0.15s ease, transform 0.15s ease; }
    .star.active { color: #fbbf24; text-shadow: 0 0 14px rgba(251, 191, 36, 0.4); }
    .star:active { transform: scale(1.2); }

    button[type="submit"] { width: 100%; background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #ffffff; border: none; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 14px 0 rgba(37, 99, 235, 0.39); transition: all 0.2s; margin-top: 10px; }
    button[type="submit"]:active { transform: scale(0.98); opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Tela de Sucesso */
    .success-screen { display: none; text-align: center; padding: 20px 0; }
    .success-icon { font-size: 48px; margin-bottom: 12px; }
    .success-screen h3 { font-size: 20px; color: #fff; margin: 0 0 8px 0; }
    .success-screen p { color: #a1a1aa; font-size: 14px; line-height: 1.5; margin: 0; }
  </style>
</head>
<body>
  <div class="card">
    <div id="form-container">
      <div class="brand">Sua Opinião Importa</div>
      <h2>Como foi sua experiência?</h2>
      <p class="subtitle">Envie fotos ou vídeos do seu produto e ajude outros clientes!</p>

      <form id="public-form">
        <div class="form-group">
          <label>Qual a sua nota?</label>
          <div class="star-rating" id="star-container">
            <span class="star active" data-value="1">★</span>
            <span class="star active" data-value="2">★</span>
            <span class="star active" data-value="3">★</span>
            <span class="star active" data-value="4">★</span>
            <span class="star active" data-value="5">★</span>
          </div>
        </div>

        <div class="form-group">
          <label>Seu Nome *</label>
          <input type="text" id="name" placeholder="Ex: Maria Silva" required>
        </div>
        
        <div class="form-group">
          <label>Sua Cidade / Empresa (Opcional)</label>
          <input type="text" id="business" placeholder="Ex: São Paulo - SP">
        </div>

        <div class="form-group">
          <label>Fotos ou Vídeos do Produto</label>
          <div class="file-dropzone" onclick="document.getElementById('media-files').click()">
            <div class="file-dropzone-text">
              📷 🎥 <span>Toque para escolher da galeria</span>
            </div>
            <input type="file" id="media-files" accept="image/*,video/*" multiple>
          </div>
          <div class="media-grid" id="media-grid"></div>
        </div>

        <div class="form-group">
          <label>Seu Depoimento *</label>
          <textarea id="text" rows="4" placeholder="Conte o que achou do produto, da entrega ou do atendimento..." required></textarea>
        </div>

        <button type="submit" id="submit-btn">Enviar Avaliação</button>
      </form>
    </div>

    <!-- Mensagem de Agradecimento Pós-Envio -->
    <div class="success-screen" id="success-screen">
      <div class="success-icon">🎉</div>
      <h3>Avaliação enviada com sucesso!</h3>
      <p>Muito obrigado pelo seu tempo e carinho. Sua avaliação ajuda nossa comunidade a crescer cada vez mais!</p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://udctjyetnervitwkjhib.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_DJMt-u-HyH0NG2AOAsriaQ_4PZpr9YC";
    let currentRating = 5;
    let selectedFiles = [];

    const fileInput = document.getElementById('media-files');
    const mediaGrid = document.getElementById('media-grid');

    fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      files.forEach(f => selectedFiles.push(f));
      renderPreviews();
      fileInput.value = '';
    });

    function renderPreviews() {
      mediaGrid.innerHTML = '';
      selectedFiles.forEach((file, index) => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'media-item';

        const btnRemove = document.createElement('button');
        btnRemove.className = 'btn-remove-item';
        btnRemove.innerText = '✕';
        btnRemove.onclick = (e) => {
          e.stopPropagation();
          removeFile(index);
        };

        const objectUrl = URL.createObjectURL(file);

        if (file.type.startsWith('video/')) {
          const video = document.createElement('video');
          video.src = objectUrl;
          video.muted = true;
          itemDiv.appendChild(video);

          const tag = document.createElement('span');
          tag.className = 'video-tag';
          tag.innerText = '🎥 VÍDEO';
          itemDiv.appendChild(tag);
        } else {
          const img = document.createElement('img');
          img.src = objectUrl;
          itemDiv.appendChild(img);
        }

        itemDiv.appendChild(btnRemove);
        mediaGrid.appendChild(itemDiv);
      });
    }

    function removeFile(index) {
      selectedFiles.splice(index, 1);
      renderPreviews();
    }

    // Estrelas
    const stars = document.querySelectorAll('.star');
    stars.forEach(star => {
      star.addEventListener('click', (e) => {
        currentRating = parseInt(e.target.getAttribute('data-value'));
        updateStars();
      });
    });

    function updateStars() {
      stars.forEach(star => {
        const val = parseInt(star.getAttribute('data-value'));
        if (val <= currentRating) star.classList.add('active');
        else star.classList.remove('active');
      });
    }

    // Upload Supabase Storage
    async function uploadAllMedia(files) {
      if (files.length === 0) return [];
      
      const uploadPromises = files.map(async (file) => {
        const isVideo = file.type.startsWith('video/');
        const fileExt = file.name.split('.').pop();
        const fileName = `public_${Date.now()}_${Math.random().toString(36).substr(2, 5)}.${fileExt}`;

        const res = await fetch(`${SUPABASE_URL}/storage/v1/object/avatars/${fileName}`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
            'Content-Type': file.type
          },
          body: file
        });

        if (res.ok) {
          return {
            url: `${SUPABASE_URL}/storage/v1/object/public/avatars/${fileName}`,
            type: isVideo ? 'video' : 'image'
          };
        }
        return null;
      });

      const results = await Promise.all(uploadPromises);
      return results.filter(r => r !== null);
    }

    // Submit do Cliente (Gera avatar por iniciais e salva como 'pending')
    document.getElementById('public-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      
      btn.disabled = true;
      btn.innerText = "Enviando suas fotos e depoimento...";

      try {
        const uploadedMediaItems = await uploadAllMedia(selectedFiles);
        const customerName = document.getElementById('name').value;
        
        // Gera foto de perfil estilizada com as iniciais do cliente
        const generatedAvatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(customerName)}&background=2563eb&color=ffffff&bold=true`;

        const data = {
          customer_name: customerName,
          business_name: document.getElementById('business').value,
          avatar_url: generatedAvatar,
          media_items: uploadedMediaItems,
          rating: currentRating,
          testimonial_text: document.getElementById('text').value,
          status: 'pending' // Envia para moderação
        };

        const res = await fetch(`${SUPABASE_URL}/rest/v1/testimonials`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify(data)
        });

        if (res.ok) {
          document.getElementById('form-container').style.display = 'none';
          document.getElementById('success-screen').style.display = 'block';
        } else {
          alert("Ops! Ocorreu um erro ao enviar. Tente novamente.");
          btn.disabled = false;
          btn.innerText = "Enviar Avaliação";
        }
      } catch (err) {
        alert("Erro de conexão.");
        btn.disabled = false;
        btn.innerText = "Enviar Avaliação";
      }
    });
  </script>
</body>
</html>
